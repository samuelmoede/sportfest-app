name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    # Ein haengender Paket-Spiegel soll den Lauf nicht ewig blockieren.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Playwright-Version ermitteln
        id: playwright
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Chromium aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Das Runner-Image bringt die System-Bibliotheken fuer Chromium schon
      # mit; --with-deps laedt zusaetzlich Schriftpakete ueber apt und hing
      # dabei schon minutenlang. Deshalb nur den Browser laden und die
      # System-Pakete nur nachinstallieren, wenn Chromium sonst nicht startet.
      - name: Chromium fuer Playwright-Browser-Tests installieren
        timeout-minutes: 8
        run: |
          python -m playwright install chromium
          if ! python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); p.chromium.launch().close(); p.stop()"; then
            echo "Chromium startet nicht, System-Pakete werden nachinstalliert."
            timeout 300 python -m playwright install-deps chromium
          fi

      - run: python -m pytest tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image bauen (validiert Dockerfile)
        run: docker build -t sportfest-app:ci .

      - name: Container starten und Healthcheck gegen die oeffentliche Startseite
        run: |
          docker run -d --name sportfest-ci -p 8500:8500 sportfest-app:ci
          for i in $(seq 1 15); do
            if curl --fail --silent http://localhost:8500/ > /dev/null; then
              echo "Healthcheck OK"
              exit 0
            fi
            sleep 2
          done
          echo "Healthcheck fehlgeschlagen"
          docker logs sportfest-ci
          exit 1
