name: claude

# Reagiert auf "@claude"-Erwaehnungen in Issues/Kommentaren: Claude erstellt
# einen claude/<...>-Branch gegen "develop", implementiert die Aenderung,
# ergaenzt Tests und oeffnet einen Pull Request. Claude merged nie selbst.
#
# Voraussetzung (einmalig, nur vom Repo-Owner ausfuehrbar - GitHub-App-
# Installation/OAuth ist ein Consent-Vorgang):
#   a) lokal in einer interaktiven Claude-Code-Session `/install-github-app`
#      ausfuehren (installiert App + ANTHROPIC_API_KEY-Secret automatisch,
#      kann diese Datei dabei durch die aktuelle Referenzversion ersetzen),
#   ODER
#   b) die "Claude" GitHub App manuell installieren und ANTHROPIC_API_KEY
#      unter Settings -> Secrets and variables -> Actions hinterlegen.
#
# Laeuft bewusst auf einem GitHub-Runner (nicht dem self-hosted NAS-Runner,
# der ausschliesslich fuer Deployment reserviert bleibt).

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: develop
          trigger_phrase: "@claude"
