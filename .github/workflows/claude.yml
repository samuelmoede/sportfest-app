name: claude

# Reagiert auf "@claude"-Erwaehnungen in Issues/Kommentaren/PR-Reviews: Claude
# erstellt einen claude/<...>-Branch gegen "develop", implementiert die
# Aenderung, ergaenzt Tests und oeffnet einen Pull Request. Claude merged nie
# selbst.
#
# Struktur uebernommen aus der offiziellen Vorlage, die die "Claude" GitHub
# App bei ihrer Installation selbst vorgeschlagen hat (@v1, minimal-invasive
# read-Berechtigungen + id-token fuer den OIDC-Tokenaustausch ueber die App,
# statt breiter Schreibrechte direkt im Workflow).
#
# Voraussetzung (einmalig, nur vom Repo-Owner ausfuehrbar - GitHub-App-
# Installation/OAuth ist ein Consent-Vorgang):
#   1) die "Claude" GitHub App installieren (GitHub -> Settings ->
#      Applications -> GitHub Apps, oder Marketplace-Suche "Claude").
#   2) In einer interaktiven Claude-Code-Session (Pro/Max-Abo) einmalig
#      `claude setup-token` ausfuehren - das nutzt das Kontingent des
#      bestehenden Abos, statt zusaetzliches API-Billing zu benoetigen.
#      Den ausgegebenen Token als Repo-Secret CLAUDE_CODE_OAUTH_TOKEN
#      hinterlegen (Settings -> Secrets and variables -> Actions).
#   Alternative statt Schritt 2, falls stattdessen separates API-Billing
#   gewuenscht ist: ANTHROPIC_API_KEY-Secret setzen und unten
#   "claude_code_oauth_token" durch "anthropic_api_key" ersetzen.
#
# Laeuft bewusst auf einem GitHub-Runner (nicht dem self-hosted NAS-Runner,
# der ausschliesslich fuer Deployment reserviert bleibt).
#
# ACHTUNG / noch zu verifizieren: "base_branch" unten stammt aus der
# vorherigen @beta-Konfiguration und ist bei @v1 nicht Teil der offiziellen
# Vorlage - unklar, ob der Input noch unterstuetzt wird. Nach dem naechsten
# echten @claude-Test in einem Issue pruefen, gegen welchen Branch der PR
# tatsaechlich geoeffnet wird; falls es main statt develop ist, Input
# entfernen und stattdessen in der Aufgabenbeschreibung explizit "PR gegen
# develop" verlangen, oder auf eine ggf. aktuellere Eingabebezeichnung
# umstellen (Dokumentation der Action pruefen).

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: develop
