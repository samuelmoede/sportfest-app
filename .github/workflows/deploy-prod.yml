name: deploy-prod

on:
  push:
    branches: [main]

env:
  # Produktivordner auf dem NAS (docker-compose.yml liegt hier), entspricht
  # dem Ordner, den Windows als Z:\sportfest-app sieht.
  DEPLOY_DIR: /volume1/docker/sportfest-app

jobs:
  deploy:
    runs-on: [self-hosted]
    # Pausiert hier, bis im GitHub-Environment "production" ein Required
    # Reviewer den Deploy manuell freigibt (Settings -> Environments).
    # Produktion wird dadurch nie automatisch veraendert, auch wenn der
    # Workflow durch jeden Push auf main ausgeloest wird.
    environment: production
    steps:
      - name: Produktivordner auf main aktualisieren
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          git config --global --add safe.directory "${{ env.DEPLOY_DIR }}"
          git fetch origin main
          git reset --hard origin/main

      - name: Container neu bauen und starten
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose up -d --build
