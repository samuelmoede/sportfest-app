name: deploy-staging

on:
  push:
    branches: [develop]

env:
  # Staging-Klon auf dem NAS, entspricht Z:\sportfest-app-dev.
  DEPLOY_DIR: /volume1/docker/sportfest-app-dev

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - name: Staging-Ordner auf develop aktualisieren (klont beim ersten Mal selbst)
        run: |
          mkdir -p "${{ env.DEPLOY_DIR }}"
          cd "${{ env.DEPLOY_DIR }}"
          if [ ! -d .git ]; then
            git clone --branch develop https://github.com/samuelmoede/sportfest-app.git .
          else
            git fetch origin develop
            git reset --hard origin/develop
          fi

      - name: Staging-Container neu bauen und starten
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose -f docker-compose.dev.yml up -d --build
